rules:
  # Bronze
  action-setup:
    status: exempt
    comment: This integration does not register any service actions.
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: This integration does not provide any service actions.
  docs-triggers:
    status: exempt
    comment: This integration does not provide any triggers.
  docs-conditions:
    status: exempt
    comment: This integration does not provide any conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: exempt
    comment: >-
      Deliberately not implemented as a live-connection check. Bluetooth
      devices go in and out of range constantly, including right after a
      battery change or while briefly out of reach during onboarding.
      Requiring a live connection at config-flow time would reject valid
      setups for a transient reason, and manual MAC entry (for a device
      not currently advertising) is an intentionally supported path.
      Discovery-based setup already implies the device was seen recently.
  test-before-setup:
    status: exempt
    comment: >-
      Same reasoning as test-before-configure: async_setup_entry already
      succeeds even when the device is temporarily unreachable (the first
      analysis is scheduled as a background task, not awaited during
      setup), and the coordinator retries automatically. Raising
      ConfigEntryNotReady here would block the entire integration on a
      condition (temporary BLE unavailability) that is normal, not an
      error.
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: This integration does not register any service actions.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: >-
      Flipr has no access code / authentication concept; there is nothing to
      re-authenticate.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: Bluetooth discovery does not carry network info to update.
  discovery: done
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: One physical device per config entry; nothing is added dynamically.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices:
    status: exempt
    comment: Single device per config entry; nothing to remove as stale.

  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: bleak communicates over Bluetooth, not HTTP; no web session involved.
  strict-typing: done

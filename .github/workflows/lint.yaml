name: Linting
  
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Ruff
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "check"

      - name: Check formatting with Ruff
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "format --check"